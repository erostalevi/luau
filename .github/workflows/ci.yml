name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, type-check & test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies (WebKitGTK for the Tauri crate)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Tauri npm/crate versions in step
        run: pnpm check:tauri
      - name: Frontend type-check
        run: pnpm check
      - name: Frontend tests
        run: pnpm test
      - name: i18n completeness (English)
        run: pnpm i18n en
      - name: i18n parity (Spanish, Portuguese)
        run: pnpm i18n es && pnpm i18n pt
      - name: Rust format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --workspace

  smoke-build:
    name: Smoke build (${{ matrix.os }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm build:web
      - run: cargo build -p luau
