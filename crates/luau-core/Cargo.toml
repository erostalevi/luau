[package]
name = "luau-core"
description = "Luau core: domain model, file store, search, history and integrations"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
parking_lot.workspace = true
tracing.workspace = true
chrono.workspace = true
getrandom = "0.4.3"
sha2 = "0.11.0"
hex = "0.4.3"
regex = "1.13.1"
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
notify = "8.2.0"
walkdir = "2.5.0"
flate2 = "1.1.10"
dirs = "7.0.0"
url = "2.5.8"
unicode-normalization = "0.1.25"
similar = "3.2.0"
base64 = "0.23.1"
futures-util = "0.3.34"
keyring = "4.2.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream", "http2", "charset", "system-proxy", "gzip"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "fs"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
percent-encoding = "2.3.2"

[dev-dependencies]
proptest = "1.11.0"
tempfile = "3.27.0"
