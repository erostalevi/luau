[package]
name = "luau"
description = "Luau — calm, local-first kanban and notes"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
name = "luau_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
luau-core = { path = "../crates/luau-core" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
parking_lot.workspace = true
tracing.workspace = true
chrono.workspace = true
tauri = { version = "2.12", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-dialog = "2.8"  # keep in step with @tauri-apps/plugin-* (tauri build checks)
tauri-plugin-updater = "2.13"  # keep in step with @tauri-apps/plugin-* (tauri build checks)
tauri-plugin-notification = "2.5"  # keep in step with @tauri-apps/plugin-* (tauri build checks)
tauri-plugin-opener = "2.7"  # keep in step with @tauri-apps/plugin-* (tauri build checks)
tauri-plugin-clipboard-manager = "2.4"  # keep in step with @tauri-apps/plugin-* (tauri build checks)
tauri-plugin-process = "2.4"  # keep in step with @tauri-apps/plugin-* (tauri build checks)
tauri-plugin-window-state = "2.5"  # keep in step with @tauri-apps/plugin-* (tauri build checks)
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
zip = { version = "8", default-features = false, features = ["deflate"] }
fontdb = { version = "0.24", default-features = false, features = ["fs"] }
notify = "8"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2"
dirs = "7"
base64 = "0.23"
percent-encoding = "2.3.2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2.6"  # keep in step with @tauri-apps/plugin-* (tauri build checks)
tauri-plugin-single-instance = "2.5"
